# GitHub Pages builds this folder with Jekyll. The pages are plain markdown without front
# matter, so they read the same on github.com; the plugins GitHub Pages turns on by default
# give each one its title from its first heading and turn links to .md files into links to
# the rendered pages.
title: Local AI Toolkit
description: Local models that do the reading — for you, and for your cloud agent.
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-sitemap
url: https://mraliev.github.io
baseurl: /local-ai-toolkit
include:
  - README.md
  - README.ru.md
readme_index:
  enabled: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - wiki
