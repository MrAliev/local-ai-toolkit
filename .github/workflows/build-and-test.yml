name: Build and test

# The product suite runs on Windows: the installer targets net10.0-windows, the launcher and staging code
# use Windows ACLs, and the npm shim behaviour several fixtures exercise only exists here. A
# Linux runner would be cheaper per minute and would not be running the product.
on:
  push:
    branches: [main]
  # Every pull request, whatever it is based on. Filtering to main meant a pull request based on
  # another branch was merged on a green tick it had never earned — nothing had run on it. Pull
  # requests here are cut from main (see "Development rules"), so this costs nothing in the normal
  # case and covers the exception instead of silently skipping it.
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the older run's answer irrelevant.
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # The whole reason this workflow is worth having. Without it a runner missing
      # scip-typescript or a language server reports the same green as a run that exercised
      # them, which is how the 0.1.31, 0.1.32 and 0.1.33 defects reached releases.
      LOCALAI_STRICT_FIXTURES: "1"
      # Declared, not assumed. scip-python 0.6.6 crashes on load under Windows —
      # `new RegExp(path.sep)` is an invalid pattern — and only reaches that code when it has to
      # build a virtual environment, so it runs on a developer machine with an interpreter it
      # already accepts and dies on a clean runner. Naming it here keeps strictness meaning
      # something for every other tool, and this line is what to delete when the upstream bug is
      # fixed. A silent skip would restore exactly the blindness this workflow removes.
      LOCALAI_STRICT_FIXTURES_EXCEPT: "scip-python"

    steps:
      - uses: actions/checkout@v7
        with:
          # Several fixtures create their own repositories with `git init`; none need history
          # here, and a shallow clone keeps the checkout quick.
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # scip-python builds a virtual environment before it indexes anything, and without a
      # predictable interpreter it fails inside its own environment setup rather than in
      # anything this repository owns.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test installed-runtime selection for Python diagnostics
        run: python -B -m unittest discover -s scripts/quality/latency -p test_localai_installation.py -v

      - name: Test SCIP fixture source boundaries
        run: python -m unittest discover -s tests/CodeSearch.Tests/Fixtures/SymbolChunking -p test_scip_enclosing_range_report.py -v

      - name: Report the toolchain
        shell: pwsh
        run: |
          dotnet --info
          git --version
          node --version
          npm --version

      # Installed before the build so a missing tool fails here, where the message is about
      # provisioning, rather than inside a fixture where it reads as a product failure.
      - name: Install fixture prerequisites
        shell: pwsh
        run: |
          # scip-python is deliberately absent. Version 0.6.6 dies on load under Windows on
          # `new RegExp(path.sep)`, an invalid pattern, and only reaches that code when it has to
          # build a virtual environment — so it runs on a developer machine that already has an
          # interpreter it accepts and cannot start here. Installing it would put a tool on the
          # runner that no fixture can use, and the failure would look like ours. Absent, it is
          # excused by name below and the skip says exactly why.
          npm install --global `
            @sourcegraph/scip-typescript@0.4.0 `
            typescript-language-server@5.3.0 `
            typescript@5.9.3 `
            pyright@1.1.403
          npm list --global --depth=0

      - name: Restore
        run: dotnet restore LocalAi.slnx

      - name: Build
        run: dotnet build LocalAi.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        env:
          LOCALAI_TEST_DIAGNOSTICS: ${{ runner.temp }}/localai-test-diagnostics
        run: |
          # One command for the whole solution, and one reason it can be one command: xunit.v3
          # 4.0 runs on Microsoft.Testing.Platform, which reports every project in the run and
          # keeps going after one of them fails. The previous loop over projects existed because
          # VSTest stopped at the first failing project and because `dotnet test` refused a
          # non-test project under tests/; neither is true here.
          #
          # --timeout replaces --blame-hang. It is deliberately far larger than any correct
          # run and smaller than the job timeout, so a hang is reported as a named failure
          # rather than consuming the job and leaving the log saying only that the
          # operation was cancelled.
          # One module at a time. The platform runs test modules in parallel by default,
          # and these do not tolerate it: the broker tests, the launcher tests and the
          # integration tests share named mutexes and one runtime directory, so running
          # them side by side is a race rather than a saving. The first attempt at this
          # step proved it — the broker module sat for twenty minutes and hit the timeout
          # while every other module passed. The old loop over projects had serialised
          # them by accident; this says so on purpose.
          dotnet test LocalAi.slnx --configuration Release --no-build `
            --max-parallel-test-modules 1 --timeout 20m

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localai-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  git-executable-boundary-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build Git executable boundary tests
        run: dotnet build tests/CodeSearch.Tests/CodeSearch.Tests.csproj --configuration Release
      - name: Test Git executable boundaries, including symbolic links
        run: dotnet tests/CodeSearch.Tests/bin/Release/net10.0/CodeSearch.Tests.dll -class CodeSearch.Tests.GitExecutableLocatorTests
      - name: Build GitHub CLI physical boundary tests
        run: dotnet build tests/LocalAi.Broker.Tests/LocalAi.Broker.Tests.csproj --configuration Release
      - name: Test GitHub CLI physical boundaries, including file symbolic links
        run: dotnet tests/LocalAi.Broker.Tests/bin/Release/net10.0/LocalAi.Broker.Tests.dll -class LocalAi.Broker.Tests.GitHubCliPhysicalPathTests

  # This portable measurement helper also runs on Linux so that symlink containment
  # is exercised even when a Windows host cannot create links without elevation.
  fixture-source-boundary-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test SCIP fixture source boundaries, including symlinks
        run: python3 -m unittest discover -s tests/CodeSearch.Tests/Fixtures/SymbolChunking -p test_scip_enclosing_range_report.py -v
